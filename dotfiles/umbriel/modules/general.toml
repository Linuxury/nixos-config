# General settings — autostart, etc.
# Included from config.toml. See docs/user/configuration.md's [include]
# section — later files override earlier ones, main file wins over all.
# Base structure follows upstream's examples/config.toml (fetched
# 2026-09-04, see dotfiles/umbriel/upstream-default.toml).

[general]
autostart = ["noctalia", "hypridle", "~/.config/umbriel/scripts/auto-column-width.py"]   # ours
# mod_key = "Super"                    # Force Super instead of nested-session Alt
xwayland = true                        # Requires xwayland-satellite; restart to change
show_cheatsheet = true                 # Show the keybind overlay on startup
focus_on_activate = false              # Do not let unsolicited requests steal focus
honor_restored_maximize = false        # Honor restored maximized state

# Session environment
# Values apply only at session startup. Native sessions also publish them to
# newly started systemd user services. Add or uncomment values as needed.
# Documentation: https://docs.noctalia.dev/umbriel/configuration/#environment

[environment]
# GTK_THEME = "Adwaita:dark"
# QT_QPA_PLATFORMTHEME = "qt5ct"

# Hardware events
# These commands run when a laptop lid opens or closes. Uncomment either hook
# to enable it.
# Documentation: https://docs.noctalia.dev/umbriel/configuration/#events

[events]
# lid_close = "notify-send 'The laptop lid is closed'"
# lid_open = "notify-send 'The laptop lid is open'"
