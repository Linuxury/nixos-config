# General settings — autostart, etc.
# Included from config.toml. See docs/user/configuration.md's [include]
# section — later files override earlier ones, main file wins over all.
# Base structure follows upstream's examples/config.toml (fetched
# 2026-09-04, see dotfiles/umbriel/upstream-default.toml).

[general]
autostart = ["noctalia", "hypridle"]   # ours
mod_key = "Super"                      # explicit — removes nested-vs-DRM auto-detection ambiguity
xwayland = true                        # upstream default — requires xwayland-satellite; restart to change
show_cheatsheet = true                 # upstream default — keybind overlay on startup
focus_on_activate = false              # upstream default — do not let unsolicited requests steal focus
honor_restored_maximize = false        # upstream default — honor restored maximized state

# Session environment — values apply only at session startup.
[environment]
# GTK_THEME = "Adwaita:dark"
# QT_QPA_PLATFORMTHEME = "qt5ct"

# Hardware events — run when a laptop lid opens or closes.
[events]
# lid_close = "notify-send 'The laptop lid is closed'"
# lid_open = "notify-send 'The laptop lid is open'"
