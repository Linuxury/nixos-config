# Match windows by application ID, title, XDG tag, content type, or focus
# state. Opening settings apply once; effects and output policies update
# while mapped. Included from config.toml. Base structure follows
# upstream's examples/config.toml (fetched 2026-09-04, see
# dotfiles/umbriel/upstream-default.toml) — the rules below (blur-all,
# Noctalia windows, PiP, Steam toasts) are upstream's own active defaults,
# not just examples, kept enabled as shipped.

# Blur every window. Keep this selectorless rule first so later matching
# rules can override individual blur settings.
[[window_rule]]
blur = true
blur_optimized = false

# Steam client -> workspace 3. Games -> workspace 2. Ported from
# dotfiles/hypr/modules/windowrules.lua's precedent: Steam (XWayland-only,
# no native Wayland client) reports app_id "steam" for the client itself;
# Proton/Steam games report "steam_app_<appid>" via XWayland, or the
# "proton-game" XDG toplevel tag for native Wayland titles.
[[window_rule]]
match.app_id = "^steam$"
default_workspace = 3

[[window_rule]]
match.app_id = "^steam_app_.*$"
default_workspace = 2

[[window_rule]]
match.xdg_tag = "^proton-game$"
default_workspace = 2

# Noctalia settings
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_size = [1020, 900]

# Noctalia share picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_size = [800, 600]

# Browsers expose no semantic PiP role or global position control.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Keep Steam notification toasts in the bottom-right corner without
# stealing focus, and pin them so workspace switches do not hide them.
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

