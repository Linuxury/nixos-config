# Keybinds. Included from config.toml.
# Base structure follows upstream's examples/config.toml verbatim (fetched
# 2026-09-04, see dotfiles/umbriel/upstream-default.toml) — custom additions
# are called out in their own sections below the upstream block.
# Configured chords replace matching built-ins; built-in chords not
# mentioned here remain active. Syntax: docs.noctalia.dev/umbriel/keybinds
# Actions: docs.noctalia.dev/umbriel/actions

[keybinds]

# ─────────────────────── Upstream defaults (unmodified) ────────────────────

# Applications and session
"Mod+Return" = "spawn:kitty"
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Q" = "window-close"
"Mod+Escape" = "session-quit"

# Overview
"Mod+O" = { action = "overview-toggle", repeat = false }

# Focus navigation. In overview, Mod+Up/Down retain normal layout focus, so they
# traverse stacks in the default horizontal layout. Bare Up/Down move between
# workspace rows.
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"

# Window move (Shift + the same focus-navigation direction)
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

# Window state and layout
"Mod+T" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+P" = "window-toggle-pinned"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+F" = "window-toggle-fullscreen"
"Mod+Ctrl+F" = "window-toggle-maximize"

# These are built in already, but explicitly declared anyway — pure
# built-ins with no declaration here don't reliably fire on this Umbriel
# version. See ~/.agents/memory/feedback_umbriel_builtin_keybinds_bug.md.
"Mod+F1" = "window-focus-next"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

# Width/height cycling and resizing
"Mod+R" = "window-cycle-width"
"Mod+Shift+R" = "window-cycle-width-back"
"Mod+Minus" = "window-modify-width:-0.1"
"Mod+Equal" = "window-modify-width:0.1"
# "Mod+Alt+Minus" = "window-modify-height:-0.1"
# "Mod+Alt+Equal" = "window-modify-height:0.1"
# "Mod+Alt+R" = "window-cycle-height"
# "Mod+Alt+Shift+R" = "window-cycle-height-back"

# Columns
"Mod+Home" = "column-focus-first"
# "Mod+End" = "column-focus-last"
# "Mod+Shift+Home" = "column-move-to-first"
# "Mod+Shift+End" = "column-move-to-last"
# "Mod+Bracketright" = "window-focus-next"
# "Mod+Bracketleft" = "window-focus-previous"
# "Mod+Shift+Bracketright" = "window-swap-next"
# "Mod+Shift+Bracketleft" = "window-swap-previous"
# "Mod+Grave" = "window-focus-last"
# "Mod+BackSpace" = "window-consume-or-expel-left"
# "Mod+C" = "column-center"
# "Mod+Shift+C" = "window-center"
# "Mod+Alt+Left" = "window-consume-left"
# "Mod+Alt+Right" = "window-consume-right"
"Mod+Ctrl+T" = "workspace-set-layout:toggle"

# Mouse / wheel
"Mod+MouseMiddle" = "layout-scroll-drag"
# "Mod+WheelUp" = "window-focus-left"
# "Mod+WheelDown" = "window-focus-right"
# "Mod+Alt+K" = "keyboard-layout-next"

# Workspaces — Mod+1 through Mod+9 switch, Shift moves the focused window.
# Upstream's example only describes these in prose, no TOML lines to
# reference.
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+Shift+Page_Up" = "window-move-to-workspace-previous"
"Mod+Shift+Page_Down" = "window-move-to-workspace-next"

# Scratchpads — each output owns a separate scratchpad. Bare actions target
# the output under the pointer; append `:DP-1` or a monitor Config name to
# target one explicitly.
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"

# Submaps temporarily replace the active keybind layer and can nest. Entry
# binds must not repeat. A table-form bind can run an action and then reset one
# level, while a global reset provides an emergency exit from any layer.
# "Mod+S" = { action = "submap:resize", repeat = false }
# "submap[resize],1" = { action = "window-set-width:0.5", submap = "reset" }
# "submap[resize],N" = { action = "submap:nudge", repeat = false }
# "submap[resize],Escape" = "submap:reset"
# "submap[nudge],Left" = "window-modify-width:-0.1"
# "submap[nudge],Right" = "window-modify-width:0.1"
# "submap[nudge],Escape" = "submap:reset"
# "Escape" = "submap:reset"

# ───────────────────────── Custom additions ─────────────────────────────────
# Everything below is ours, not part of the upstream default. None of it
# overrides a built-in or an upstream-active chord above.

# Core apps
"Mod+Shift+Return" = "spawn:kitty --class floating-term"
"Mod+E"            = "spawn:nautilus"

# Session control — Mod+Escape stays the built-in session-quit (see the
# upstream defaults section above); these are separate additions, not
# overrides of that built-in.
"Mod+Ctrl+Escape" = "spawn:systemctl suspend -i"
"Mod+Shift+E" = "spawn:noctalia msg panel-open control-center session"

# Night light
"Mod+Shift+N" = "spawn:noctalia msg nightlight-toggle"

# Audio device switching — opens Noctalia's audio panel (output+input pickers
# together, so both binds open the same panel)
"Mod+A"       = "spawn:noctalia msg panel-open control-center audio"
"Mod+Shift+A" = "spawn:noctalia msg panel-open control-center audio"

# Screenshots — save+notify, edit only if you click the notification
"Print"           = "spawn:~/.config/umbriel/scripts/screenshot.sh area save"
"Mod+Print"       = "spawn:~/.config/umbriel/scripts/screenshot.sh fullscreen save"
"Mod+Z"           = "spawn:~/.config/umbriel/scripts/screenshot.sh area save"
"Mod+X"           = "spawn:~/.config/umbriel/scripts/screenshot.sh fullscreen save"
"Shift+Print"     = "spawn:~/.config/umbriel/scripts/screenshot.sh area copy"
"Mod+Shift+Print" = "spawn:~/.config/umbriel/scripts/screenshot.sh fullscreen copy"

# Media keys — noctalia msg instead of the upstream doc's raw wpctl recipe
XF86AudioRaiseVolume = "spawn:noctalia msg volume-up"
XF86AudioLowerVolume = "spawn:noctalia msg volume-down"
XF86AudioMute        = "spawn:noctalia msg volume-mute"
XF86AudioMicMute     = "spawn:noctalia msg mic-mute"
XF86AudioPlay        = "spawn:playerctl play-pause"
XF86AudioNext        = "spawn:playerctl next"
XF86AudioPrev        = "spawn:playerctl previous"

# Brightness (allow_when_locked = works on the lock screen)
XF86MonBrightnessUp   = { action = "spawn:brightnessctl set +5%", allow_when_locked = true }
XF86MonBrightnessDown = { action = "spawn:brightnessctl set 5%-", allow_when_locked = true }
