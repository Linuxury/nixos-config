# ===========================================================================
# hypridle-laptop.conf — Idle management (laptop hosts)
#
# Timeline:
#   2 min  — dim screen (backlight)
#   5 min  — turn monitor off (DPMS)
#   7 min  — lock with noctalia msg session lock
#   15 min — suspend
# ===========================================================================

general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = loginctl lock-session                  # Lock before systemd suspend
    after_sleep_cmd = ~/.config/hypr/scripts/compositor-dpms.sh on   # Wake screen after resume
}

# Dim screen after 2 minutes of inactivity
listener {
    timeout = 120
    on-timeout = ~/.config/hypr/scripts/dim-screen.sh
    on-resume = ~/.config/hypr/scripts/restore-brightness.sh
}

# Turn monitor off after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/compositor-dpms.sh off
    on-resume = ~/.config/hypr/scripts/compositor-dpms.sh on
}

# Lock screen after 7 minutes of inactivity
listener {
    timeout = 420
    on-timeout = loginctl lock-session
}

# Suspend after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
