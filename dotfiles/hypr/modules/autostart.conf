# ===========================================================================
# modules/autostart.conf — Apps and daemons that start with Hyprland
#
# exec-once = runs once at session start, never again until next login
# exec       = runs every time the config is reloaded (hyprctl reload)
# ===========================================================================

# ---------------------------------------------------------------------------
# Wallpaper — hypr-matugen path unit watches last-matugen-wallpaper and cycles
# Wallpaper dir: ~/Pictures/Wallpapers (→ nixos-config/assets/Wallpapers/<dir>)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Status bar + Notifications — shell-specific launch (managed per-module)
# Each shell module writes its exec-once into shell-autostart.conf at activation.
# Shells that self-start via systemd (DMS, Wayle) leave this file empty.
# ---------------------------------------------------------------------------
source = ~/.config/hypr/shell-autostart.conf

# ---------------------------------------------------------------------------
# Idle management — dim, lock, suspend
# ---------------------------------------------------------------------------
exec-once = hypridle

# ---------------------------------------------------------------------------
# Polkit authentication agent
# Needed for GUI apps to request elevated permissions (pkexec, gvfs mounts, etc.)
# ---------------------------------------------------------------------------
exec-once = /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1

# ---------------------------------------------------------------------------
# Secret storage — GNOME Keyring daemon
#
# PAM unlocks the keyring at login, but the greetd-spawned daemon gets killed
# when UWSM creates its systemd session scope. Starting it here ensures the
# daemon lives in the UWSM-managed cgroup for the full session lifetime.
# Requires the login keyring to have an empty password to auto-unlock.
# ---------------------------------------------------------------------------
exec-once = gnome-keyring-daemon --start --daemonize --components=secrets

# ---------------------------------------------------------------------------
# System tray daemons
# ---------------------------------------------------------------------------
exec-once = nm-applet --indicator   # Network manager tray icon
exec-once = blueman-applet          # Bluetooth tray icon
exec-once = openrgb --startminimized  # RGB lighting control tray icon

# ---------------------------------------------------------------------------
# Clipboard history — wl-clipboard + cliphist
# Watches clipboard for text and images, stores history for SUPER+V picker
# ---------------------------------------------------------------------------
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ---------------------------------------------------------------------------
# Night light — auto warm colors at sunset (8 PM)
# ---------------------------------------------------------------------------
exec-once = ~/.config/hypr/scripts/nightlight.sh on

# ---------------------------------------------------------------------------
# Host-specific overrides — runs at login after Hyprland fully starts
# Sets per-display opacity (e.g. OLED needs lower opacity than LCD)
# ---------------------------------------------------------------------------
exec-once = ~/.config/hypr/scripts/host-overrides.sh

# ---------------------------------------------------------------------------
# Auto column width — scrolling layout: 67% for 1 window, 50% for 2+
# ---------------------------------------------------------------------------
exec-once = ~/.config/hypr/scripts/col-width-auto.sh

# ---------------------------------------------------------------------------
# Game workspace — move Proton/native-Wayland games to WS 2 after Steam places them
# Windowrules fire too early (before Steam's set_fullscreen request); this script
# listens to openwindow events and moves proton-game windows after they settle.
# ---------------------------------------------------------------------------
exec-once = ~/.config/hypr/scripts/game-workspace.sh
