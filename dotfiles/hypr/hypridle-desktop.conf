# ===========================================================================
# hypridle-desktop.conf — Idle management (desktop hosts)
#
# Timeline:
#   10 min — turn monitor off (DPMS) — no dim, no backlight on desktop
#   15 min — lock with hyprlock
#   (no suspend — desktop stays powered on)
# ===========================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Don't launch if already running
    before_sleep_cmd = loginctl lock-session     # Lock before systemd suspend
    after_sleep_cmd = hyprctl dispatch dpms on   # Wake screen after resume
}

# Turn monitor off after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock screen after 15 minutes of inactivity
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
