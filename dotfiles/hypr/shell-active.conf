# ===========================================================================
# dotfiles/hypr/shell-active.conf — Active shell Hyprland overrides
#
# This file is managed by Home Manager activation (home.activation.shellActiveConf).
# Do not edit manually — it is overwritten on every `nru` / nixos-rebuild.
#
# Content is written by whichever shell module is enabled:
#   shell.dms.enable      → sources dms/colors.conf, cursor.conf, outputs.conf, binds.conf
#   shell.wayle.enable    → empty (Wayle manages its own layer)
#   shell.noctalia.enable → empty (Noctalia manages its own layer)
# ===========================================================================

source = ./dms/colors.conf
source = ./dms/cursor.conf
source = ./dms/outputs.conf
source = ./dms/binds.conf
