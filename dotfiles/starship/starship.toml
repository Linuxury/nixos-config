format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$rust\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = 'noctalia'

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ' '

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[rust]
style = 'orange'
symbol = ' '

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.nord]
dark_blue = '#5E81AC'
blue      = '#81A1C1'
teal      = '#88C0D0'
red       = '#BF616A'
orange    = '#D08770'
green     = '#A3BE8C'
yellow    = '#EBCB8B'
purple    = '#B48EAD'
gray      = '#434C5E'
black     = '#2E3440'
white     = '#D8DEE9'

# No placeholder [palettes.noctalia] block here on purpose — Noctalia's own
# starship theming appends a marked `>>> NOCTALIA STARSHIP PALETTE >>>`
# block at the end of the file rather than replacing a block in place
# (confirmed live: an earlier hand-written Nord-based placeholder here just
# ended up duplicated alongside Noctalia's real one — invalid TOML with two
# [palettes.noctalia] tables, though starship tolerated it and used the
# last one). There's a brief "Could not find color palette: noctalia"
# warning between a fresh HM switch and the first wallpaper change now,
# but that's harmless and one-time — better than permanent duplicate keys.
